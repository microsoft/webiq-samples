name: Enterprise demo

on:
  pull_request:
    paths:
      - 'samples/typescript/enterprise-demo/**'
      - '.github/workflows/enterprise-demo.yml'
  push:
    branches: [main]
    paths:
      - 'samples/typescript/enterprise-demo/**'
      - '.github/workflows/enterprise-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/typescript/enterprise-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/typescript/enterprise-demo/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
